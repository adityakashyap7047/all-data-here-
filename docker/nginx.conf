events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream notixcloud_app {
        server app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name notixcloud.com www.notixcloud.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name notixcloud.com www.notixcloud.com;

        ssl_certificate /etc/letsencrypt/live/notixcloud.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/notixcloud.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
        ssl_prefer_server_ciphers off;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "origin-when-cross-origin";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';";

        location / {
            proxy_pass http://notixcloud_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }

        location /_next/static {
            proxy_pass http://notixcloud_app;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, immutable";
        }

        location /images {
            proxy_pass http://notixcloud_app;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public";
        }
    }
}